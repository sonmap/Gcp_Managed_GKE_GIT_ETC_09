steps:
  - name: hashicorp/terraform:1.9
    id: init
    dir: terraform/02-sandbox
    args:
      - init
      - -reconfigure
      - -backend-config=bucket=${_STATE_BUCKET}
      - -backend-config=prefix=sandbox/${_TASK_NAME}
  - name: hashicorp/terraform:1.9
    id: destroy
    dir: terraform/02-sandbox
    secretEnv:
      - TF_VAR_jupyter_oauth_client_id
      - TF_VAR_jupyter_oauth_client_secret
    args:
      - destroy
      - -input=false
      - -auto-approve
      - -var=task_name=${_TASK_NAME}
      - -var=group_email=${_GROUP_EMAIL}
      - -var=enable_jupyterhub=true
      - -var=jupyter_domain=${_JUPYTER_DOMAIN}
substitutions:
  _TASK_NAME: sbx01
  _GROUP_EMAIL: pgrp-gcp-dev-sbx01@sonmap.net
  _STATE_BUCKET: REPLACE_STATE_BUCKET
  _WORKER_POOL: REPLACE_WORKER_POOL
  _JUPYTER_DOMAIN: jupyter-sbx01.sonmap.net
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/jupyter-oauth-client-id/versions/latest
      env: TF_VAR_jupyter_oauth_client_id
    - versionName: projects/$PROJECT_ID/secrets/jupyter-oauth-client-secret/versions/latest
      env: TF_VAR_jupyter_oauth_client_secret
options:
  logging: CLOUD_LOGGING_ONLY
  pool:
    name: ${_WORKER_POOL}
