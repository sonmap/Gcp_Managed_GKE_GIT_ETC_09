steps:
  - name: gcr.io/cloud-builders/docker
    id: build-automation-runner
    args:
      - build
      - -f
      - automation-runner/Dockerfile
      - -t
      - ${_AUTOMATION_IMAGE_REPO}:git-${SHORT_SHA}
      - -t
      - ${_AUTOMATION_IMAGE_REPO}:latest
      - automation-runner

  - name: gcr.io/cloud-builders/docker
    id: push-automation-runner-release
    args: [push, ${_AUTOMATION_IMAGE_REPO}:git-${SHORT_SHA}]

  - name: gcr.io/cloud-builders/docker
    id: push-automation-runner-latest
    args: [push, ${_AUTOMATION_IMAGE_REPO}:latest]

  - name: gcr.io/cloud-builders/docker
    id: build-provisioner
    args:
      - build
      - -f
      - cloudrun-provisioner/Dockerfile
      - -t
      - ${_PROVISIONER_IMAGE_REPO}:git-${SHORT_SHA}
      - -t
      - ${_PROVISIONER_IMAGE_REPO}:latest
      - cloudrun-provisioner

  - name: gcr.io/cloud-builders/docker
    id: push-provisioner-release
    args: [push, ${_PROVISIONER_IMAGE_REPO}:git-${SHORT_SHA}]

  - name: gcr.io/cloud-builders/docker
    id: push-provisioner-latest
    args: [push, ${_PROVISIONER_IMAGE_REPO}:latest]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: publish-sandbox-source
    entrypoint: bash
    args:
      - -ceu
      - |
        release_id="git-${SHORT_SHA}"
        bash scripts/publish-sandbox-source.sh "${_BUNDLE_BUCKET}" "${release_id}" | tee /workspace/source.env
        . /workspace/source.env

        export RELEASE_ID="${release_id}"
        export COMMIT_SHA_VALUE="${COMMIT_SHA}"
        export RUNNER_IMAGE="${_AUTOMATION_IMAGE_REPO}:${release_id}"
        export PROVISIONER_IMAGE="${_PROVISIONER_IMAGE_REPO}:${release_id}"
        export ARCHIVE_URI="${archive_uri}"
        export GENERATION="${generation}"
        export SHA256="${sha256}"

        python3 - <<'PY'
        import json
        import os

        payload = {
            "release_id": os.environ["RELEASE_ID"],
            "git_commit": os.environ["COMMIT_SHA_VALUE"],
            "runner_image": os.environ["RUNNER_IMAGE"],
            "provisioner_image": os.environ["PROVISIONER_IMAGE"],
            "archive_uri": os.environ["ARCHIVE_URI"],
            "generation": int(os.environ["GENERATION"]),
            "sha256": os.environ["SHA256"],
        }
        with open("/workspace/release.json", "w", encoding="utf-8") as stream:
            json.dump(payload, stream, indent=2, sort_keys=True)
        PY

        gcloud storage cp /workspace/release.json \
          "gs://${_BUNDLE_BUCKET}/platform-releases/${release_id}/release.json"

        echo "============================================================"
        echo "PLATFORM RELEASE READY"
        echo "release_id=${release_id}"
        echo "runner_image=${_AUTOMATION_IMAGE_REPO}:${release_id}"
        echo "provisioner_image=${_PROVISIONER_IMAGE_REPO}:${release_id}"
        cat /workspace/source.env
        echo "============================================================"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: roll-provisioner
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run services update run-sandbox-provisioner \
          --project="${_CICD_PROJECT_ID}" \
          --region="${_REGION}" \
          --image="${_PROVISIONER_IMAGE_REPO}:latest" \
          --update-env-vars="PROVISIONER_SOURCE_VERSION=git-${SHORT_SHA}" \
          --quiet

substitutions:
  _CICD_PROJECT_ID: prj-b-cicd-local-236d
  _REGION: asia-northeast3
  _BUNDLE_BUCKET: prj-b-cicd-local-236d-sandbox-bundles
  _AUTOMATION_IMAGE_REPO: asia-northeast3-docker.pkg.dev/prj-b-cicd-local-236d/ar-sandbox-platform/sandbox-automation-runner
  _PROVISIONER_IMAGE_REPO: asia-northeast3-docker.pkg.dev/prj-b-cicd-local-236d/ar-sandbox-platform/run-sandbox-provisioner

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
